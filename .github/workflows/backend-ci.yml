name: backend-ci

on:
  push:
    branches: [main]
  # No path filter: a frontend-only PR that relies on a backend contract
  # change (a new query param, a renamed field) must fail here if that
  # change isn't actually present. A path filter on backend/** let exactly
  # that happen once already — a PR touching only App.jsx got no
  # backend-ci run at all, so it looked cleaner than PRs that were
  # correctly failing, and it would have shipped a frontend control
  # calling an endpoint shape the deployed API didn't have. Runs in ~2.5
  # minutes, so unconditional is cheap enough not to filter.
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfx
          POSTGRES_PASSWORD: sfx
          POSTGRES_DB: sfx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sfx:sfx@localhost:5432/sfx_ci
      # Read at import time (app.brief -> Anthropic()) — dummy value is fine,
      # the smoke test never makes a live call.
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run smoke tests
        # `python -m pytest`, not bare `pytest`. tests/ has no __init__.py, so
        # pytest's default "prepend" import mode puts backend/tests on
        # sys.path instead of backend/, and `from app.main import app` dies at
        # collection with ModuleNotFoundError: No module named 'app'. The -m
        # form puts the working directory (backend/) on sys.path first, which
        # is why this passes locally and the console script never did.
        run: python -m pytest tests/ -v
