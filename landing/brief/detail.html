<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentimentFX Morning Brief Archive</title>
  <meta name="description" content="An archived edition of the SentimentFX Morning Brief — AI-scored market sentiment summary across crypto, FX and equities.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#080c10">

  <meta property="og:site_name" content="SentimentFX">
  <meta property="og:title" content="SentimentFX Morning Brief — Archive">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://sentimentfx.org/dashboard.jpeg">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#080c10;--surface:#0d1117;--surface2:#161b22;
      --border:#21262d;--border2:#30363d;
      --text:#e6edf3;--muted:#7d8590;
      --accent:#f0b429;--accent2:#58a6ff;
      --positive:#3fb950;--negative:#f85149;
      --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;}
    a{color:var(--accent);text-decoration:none;}
    a:hover{text-decoration:underline;}

    nav{display:flex;align-items:center;justify-content:space-between;padding:14px 40px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
    .nav-logo{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:0.15em;color:var(--accent);text-transform:uppercase;}
    .nav-logo span{color:var(--muted);font-weight:400;}
    .nav-links{display:flex;gap:24px;list-style:none;align-items:center;}
    .nav-links a{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;color:var(--muted);}
    .nav-links a:hover{color:var(--text);text-decoration:none;}
    .nav-cta{background:var(--accent);color:#080c10!important;padding:6px 14px;border-radius:2px;font-weight:600;}

    main{max-width:680px;margin:0 auto;padding:48px 24px;}
    .breadcrumb{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--muted);margin-bottom:24px;text-transform:uppercase;}
    .breadcrumb a{color:var(--muted);}
    .breadcrumb span{margin:0 8px;color:var(--border2);}

    .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;}
    h1{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.2;margin-bottom:24px;}

    .signal-card{background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:20px 24px;margin-bottom:32px;}
    .signal-eyebrow{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--accent);letter-spacing:0.12em;margin-bottom:10px;text-transform:uppercase;}
    .signal-text{color:var(--text);font-size:15px;line-height:1.7;}

    .paywall{margin-top:32px;padding:24px 28px;border:1px dashed var(--accent);border-radius:2px;background:rgba(240,180,41,0.04);text-align:center;}
    .paywall-title{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;}
    .paywall-text{font-size:13px;color:#c9d1d9;margin-bottom:16px;max-width:480px;margin-left:auto;margin-right:auto;line-height:1.6;}
    .paywall-cta{display:inline-block;background:var(--accent);color:#080c10!important;padding:10px 20px;border-radius:2px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}

    .ticker-block{background:var(--surface);border:1px solid var(--border);padding:18px 20px;margin-bottom:12px;border-radius:2px;}
    .ticker-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
    .ticker-symbol{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);}
    .ticker-name{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:8px;}
    .ticker-price{font-family:var(--mono);font-size:13px;color:var(--text);text-align:right;}
    .ticker-change{font-family:var(--mono);font-size:11px;text-align:right;}
    .ticker-sentiment{background:var(--surface2);padding:8px 10px;display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);}
    .ticker-sentiment .val{margin-left:8px;font-weight:600;font-size:13px;}
    .ticker-headline{margin-top:10px;padding:8px 10px;background:var(--surface2);font-size:12px;color:#c9d1d9;font-family:var(--sans);line-height:1.5;}
    .ticker-headline a{color:var(--accent2);}
    .divergence-flag{background:rgba(240,180,41,0.08);border-left:2px solid var(--accent);padding:8px 10px;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:0.06em;}
    .pos{color:var(--positive);}
    .neg{color:var(--negative);}
    .neutral{color:var(--accent);}

    .archive-link{display:block;margin-top:32px;padding:14px;background:var(--surface);border:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0.06em;}
    .archive-link:hover{color:var(--text);text-decoration:none;}

    .footer{margin-top:48px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.05em;}

    @media (max-width:640px){
      nav{padding:12px 16px;}
      .nav-links{gap:12px;}
      main{padding:32px 16px;}
      h1{font-size:20px;}
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">SENTIMENT<span>FX</span></a>
    <ul class="nav-links">
      <li><a href="/brief">All briefs</a></li>
      <li><a href="https://app.sentimentfx.org/">Dashboard</a></li>
      <li><a href="https://app.sentimentfx.org/?auth=signup" class="nav-cta">Subscribe</a></li>
    </ul>
  </nav>

  <main>
    <div class="breadcrumb">
      <a href="/">SentimentFX</a><span>/</span>
      <a href="/brief">Morning Brief</a><span>/</span>
      <span id="breadcrumb-date">Loading…</span>
    </div>

    <div class="eyebrow" id="brief-eyebrow">Daily morning brief</div>
    <h1 id="brief-date">Loading…</h1>

    <div id="brief-content">
      <div class="signal-card" style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:0.08em;padding:32px;">LOADING…</div>
    </div>

    <a href="/brief" class="archive-link">← View all briefs</a>

    <div class="footer">Not financial advice. Sentiment signals are probabilistic.</div>
  </main>

  <script>
    const API = "https://api.sentimentfx.org";

    // Parse date from path: /brief/2026-06-24 → "2026-06-24"
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const dateParam = pathParts[1];   // ["brief", "2026-06-24"]
    if (!dateParam || !/^\d{4}-\d{2}-\d{2}$/.test(dateParam)) {
      window.location.href = "/brief";
    }

    const fmtPrice = (v, ticker) => {
      if (v == null) return "—";
      const isFx = ["EURUSD","GBPUSD","USDJPY","AUDUSD","USDCAD","USDCHF","NZDUSD"].includes(ticker);
      if (isFx) return v.toFixed(4);
      if (v >= 1000) return "£" + (v / 1000).toFixed(2) + "k";
      if (v >= 1) return "£" + v.toFixed(2);
      return "£" + v.toFixed(4);
    };
    const fmtPct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
    const fmtScore = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(3);
    const colorClass = v => v == null ? "neutral" : v > 0.05 ? "pos" : v < -0.05 ? "neg" : "neutral";

    async function loadBrief() {
      const res = await fetch(`${API}/brief/${dateParam}`);
      if (!res.ok) {
        document.getElementById("brief-content").innerHTML = `
          <div class="signal-card" style="text-align:center;color:var(--muted);">
            No brief found for ${dateParam}. <a href="/brief">View archive →</a>
          </div>`;
        return;
      }
      const brief = await res.json();

      // Header
      const dt = new Date(brief.date);
      const dateLabel = dt.toLocaleDateString("en-GB", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
      document.title = `Morning Brief — ${dateLabel} | SentimentFX`;
      document.getElementById("brief-date").textContent = dateLabel;
      document.getElementById("breadcrumb-date").textContent = dt.toLocaleDateString("en-GB", { day:"numeric", month:"short" });
      document.getElementById("brief-eyebrow").textContent =
        `${brief.tickers.join(" · ")} · ${brief.sent_count} subscribers received this`;

      // Always-visible AI summary (free + paid)
      let html = `
        <div class="signal-card">
          <div class="signal-eyebrow">Today's signal</div>
          <div class="signal-text">${brief.ai_summary}</div>
        </div>`;

      // Per-ticker breakdown (paid only)
      if (brief.is_paywalled) {
        html += `
          <div class="paywall">
            <div class="paywall-title">The rest of this brief is for subscribers.</div>
            <div class="paywall-text">
              Per-ticker sentiment scores, 24h price moves, top headlines and
              divergence flags for ${brief.tickers.join(", ")} — and tomorrow
              morning's brief in your inbox at 07:00 London.
            </div>
            <a href="https://app.sentimentfx.org/?auth=signup&from=brief-${dateParam}" class="paywall-cta">
              Subscribe — £9.99/mo →
            </a>
          </div>`;
      } else {
        // Render the full ticker_data
        for (const d of (brief.ticker_data || [])) {
          const sentCls = colorClass(d.current_sentiment);
          const priceCls = (d.price_change_pct || 0) >= 0 ? "pos" : "neg";
          const headlineHtml = d.top_headline ? `
            <div class="ticker-headline">
              <a href="${d.top_headline.url}" target="_blank" rel="noreferrer">${d.top_headline.title}</a>
              <span class="${colorClass(d.top_headline.sentiment_score)}" style="margin-left:8px;font-family:var(--mono);">${fmtScore(d.top_headline.sentiment_score)}</span>
            </div>` : "";
          const divHtml = d.divergence ? `
            <div class="divergence-flag">⚠ DIVERGENCE — SENTIMENT AND PRICE MOVING OPPOSITE</div>` : "";
          const deltaSign = (d.sentiment_delta || 0) >= 0 ? "↑" : "↓";
          html += `
            <div class="ticker-block">
              <div class="ticker-row">
                <div>
                  <span class="ticker-symbol">${d.ticker}</span>
                  <span class="ticker-name">${d.name || ""}</span>
                </div>
                <div>
                  <div class="ticker-price">${fmtPrice(d.current_price_gbp, d.ticker)}</div>
                  <div class="ticker-change ${priceCls}">${fmtPct(d.price_change_pct)}</div>
                </div>
              </div>
              <div class="ticker-sentiment">
                SENTIMENT
                <span class="val ${sentCls}">${fmtScore(d.current_sentiment)}</span>
                <span style="margin-left:6px;">${deltaSign}${Math.abs(d.sentiment_delta || 0).toFixed(3)}</span>
              </div>
              ${headlineHtml}
              ${divHtml}
            </div>`;
        }
      }

      document.getElementById("brief-content").innerHTML = html;
    }

    loadBrief().catch(err => {
      document.getElementById("brief-content").innerHTML = `
        <div class="signal-card" style="text-align:center;color:var(--negative);">
          Failed to load brief: ${err.message || err}.  <a href="/brief">View archive →</a>
        </div>`;
    });
  </script>
</body>
</html>
